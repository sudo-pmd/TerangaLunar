<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 132" role="img" aria-label="TerangaLunar">
  <title>TerangaLunar</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C567"/>
      <stop offset="0.55" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#9C7A18"/>
    </linearGradient>
    <clipPath id="markClip">
      <rect x="0" y="0" width="132" height="132"/>
    </clipPath>
  </defs>

  <g clip-path="url(#markClip)">
    <!-- Crescent: solid outer disc with the inner disc cut away. -->
    <path fill="url(#gold)"
      d="M74 10a56 56 0 1 0 24 106 44 44 0 0 1-10-92 56 56 0 0 0-14-14z" />
    <!-- Lunar filigree inside the crescent body. -->
    <g fill="none" stroke="#FFF8E4" stroke-opacity="0.55" stroke-width="2.1" stroke-linecap="round">
      <path d="M60 26c-16 8-24 24-22 40 2 15 12 27 26 33" />
      <path d="M66 34c-12 8-18 20-16 33 2 13 10 22 21 27" />
    </g>
    <!-- Accent wedges, echoing the woven crescent pattern. -->
    <g fill="#B23A3A" opacity="0.85">
      <path d="M52 52c3-4 7-7 11-9l3 12-9 6z" />
      <path d="M55 84c-2-4-3-8-3-12l10 4 1 12z" />
    </g>

    <!-- Orbit. -->
    <g fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round">
      <ellipse cx="66" cy="70" rx="62" ry="24" transform="rotate(-18 66 70)" />
      <ellipse cx="66" cy="70" rx="62" ry="24" transform="rotate(-18 66 70)"
        stroke-opacity="0.35" stroke-dasharray="3 9" />
    </g>

    <!-- Five-pointed star. -->
    <path fill="#FFFFFF"
      d="M66 40l6.6 15.4 16.7 1.5-12.6 11 3.8 16.3L66 75.8l-14.5 8.4 3.8-16.3-12.6-11 16.7-1.5z"/>

    <!-- Lander on the orbit, upper right. -->
    <g transform="translate(103 22)">
      <path fill="#FFFFFF" d="M3.4 4.6h9.2l2.8 5.4H0.6z"/>
      <rect x="2.6" y="1.2" width="10.8" height="4.2" rx="1.6" fill="#E9EDF6"/>
      <circle cx="8" cy="3.3" r="1.1" fill="#080B14"/>
      <g stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round">
        <path d="M1 10.6 3.2 15M15 10.6 12.8 15"/>
        <path d="M0 15.6h4M12 15.6h4"/>
      </g>
    </g>

    <!-- Baobab silhouette on the horizon. -->
    <g fill="#FFFFFF" opacity="0.92">
      <path d="M64 96h3.6v27H64z"/>
      <path d="M65.8 100c-3.5-3-7-4-9.6-3.6 2.2-3 5.8-3.6 9.6-1.4z"/>
      <path d="M65.8 104c3.5-3.4 7.4-4.6 10.4-4-2.4-3.4-6.4-4-10.4-1.6z"/>
      <path d="M57 86c-1.8-4 .4-8 4.6-8.6 1-3.2 4.4-4.6 7-3 2.6-1.6 6 .2 6.6 3.4 3.6 1.2 5 5.2 3.2 8.2z"/>
    </g>
    <path fill="#FFFFFF" d="M44 124h45v2.6H44z"/>
  </g>
</svg>
