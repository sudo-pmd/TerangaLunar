<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TerangaLunar — le jour et la nuit au pôle Sud lunaire</title>
    <meta name="description" content="TerangaLunar suit le cycle jour/nuit au pôle Sud de la Lune : globe 3D en temps réel, relief mesuré par LOLA, ensoleillement de chaque point d’atterrissage, fenêtres de communication avec la Terre.">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#070a12">
    <meta property="og:title" content="TerangaLunar">
    <meta property="og:description" content="Le cycle jour/nuit de la Lune, en direct, et les vraies fenêtres d’atterrissage au pôle Sud.">
    <meta property="og:image" content="assets/img/teranga-lunar.svg">
    <link rel="icon" type="image/svg+xml" href="assets/img/teranga-mark.svg">
    <link rel="stylesheet" href="assets/css/tokens.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/theme3.css">
    <link rel="stylesheet" href="assets/css/surface.css">
    <link rel="stylesheet" href="assets/css/print.css">
    <!-- Three.js is vendored under assets/vendor/three: no CDN, so the site
         works offline and on any static host without a network round-trip. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three/three.module.js",
          "three/addons/": "./assets/vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas class="starfield" aria-hidden="true"></canvas>

    <!-- The loader is in the markup, not built by JavaScript: it must be on
         screen before the first module is even fetched. -->
    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="loader-inner">
        <img class="loader-logo" src="assets/img/teranga-lunar.svg"
          alt="TerangaLunar — Space &amp; Lunar Missions" width="300" height="72">
        <div class="loader-ring" aria-hidden="true"><span></span></div>
        <p class="loader-line" id="loader-line">Chargement</p>
        <p class="loader-fallback" id="loader-fallback" hidden></p>
      </div>
    </div>

    <div id="app">
      <p class="boot">Chargement des données…</p>
    </div>

    <noscript>
      <p class="boot">Cette application a besoin de JavaScript pour calculer les positions du Soleil et de la Terre.</p>
    </noscript>

    <!-- If the modules never start (opened from a local file, or a host that
         does not serve them), say so instead of spinning forever. -->
    <script>
      setTimeout(function () {
        if (window.__bootReady) return;
        var el = document.getElementById('loader-fallback');
        if (!el) return;
        var line = document.getElementById('loader-line');
        if (line) line.hidden = true;
        el.hidden = false;
        el.textContent = location.protocol === 'file:'
          ? 'Les modules du site ne se chargent pas depuis un fichier local. Ouvrez la version en ligne, ou lancez « node scripts/serve.mjs » puis http://127.0.0.1:4173.'
          : 'Le chargement a échoué. Rechargez la page (Ctrl+F5) ; si cela persiste, la console du navigateur indique le fichier manquant.';
      }, 9000);
    </script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
